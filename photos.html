<script>
  // State
  const titleInput = document.getElementById('titleInput');
  const descInput = document.getElementById('descInput');
  const colsInput = document.getElementById('colsInput');
  const gapInput = document.getElementById('gapInput');
  const marginInput = document.getElementById('marginInput');
  const fileInput = document.getElementById('fileInput');
  const grid = document.getElementById('grid');
  const pageTitle = document.getElementById('pageTitle');
  const pageDesc = document.getElementById('pageDesc');
  const fitMode = document.getElementById('fitMode');
  const btnUndo = document.getElementById('btnUndo');
  const toast = document.getElementById('toast');

  let images = [];
  let lastDeleted = null;
  let dragSrc = null;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function showToast(message, withUndo = false) {
    toast.innerHTML = message;
    toast.style.display = "block";

    if (withUndo) {
      const btn = document.createElement("button");
      btn.textContent = "Undo";
      btn.className = "btn btn-warning btn-sm ms-2";
      btn.onclick = undoDelete;
      toast.appendChild(btn);
    }

    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.style.display = "none", 3000);
  }

  function hideToast() {
    toast.style.display = "none";
  }

  function render() {
    document.documentElement.style.setProperty('--cols', colsInput.value);
    document.documentElement.style.setProperty('--gap', gapInput.value + "px");
    document.documentElement.style.setProperty('--margin', marginInput.value + "mm");

    grid.innerHTML = "";
    pageTitle.textContent = titleInput.value || "(Title)";
    pageDesc.textContent = descInput.value || "";

    grid.classList.remove("fit-fill", "fit-cover", "fit-contain");
    grid.classList.add("fit-" + fitMode.value);

   images.forEach((obj, idx) => {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.setAttribute("draggable", "true");
  cell.dataset.index = idx;

  if (obj.type === "qr") {
    const wrapper = document.createElement("div");
    wrapper.style.position = "absolute";
    wrapper.style.textAlign = "center";
    wrapper.style.backgroundColor = "#fff";
    wrapper.style.borderRadius = "6px";
    wrapper.style.border = "1px solid #000";

    const label = document.createElement("div");
    label.textContent = "Scan Me";
    label.style.fontSize = "10px";
    label.style.color = "#444";
    label.style.fontWeight = "900";
    label.style.marginBottom = "-5px";

    const canvas = document.createElement("canvas");
    canvas.width = 200;
    canvas.height = 200;
    canvas.style.padding = "2px";
    canvas.style.display = "block";

    new QRious({
      element: canvas,
      size: 200,
      value: obj.url
    });

    wrapper.appendChild(label);
    wrapper.appendChild(canvas);
    cell.appendChild(wrapper);
  } 
  else {
    const img = document.createElement("img");
    img.src = obj.src;
    cell.appendChild(img);
  }

  const remove = document.createElement("div");
  remove.className = "remove-btn";
  remove.innerHTML = "×";
  remove.onclick = () => deleteImage(idx);

  cell.appendChild(remove);
  addDragHandlers(cell);
  grid.appendChild(cell);
});


    autoFixSpacing(parseInt(colsInput.value));
  }

  function deleteImage(idx) {
    lastDeleted = { item: images[idx], index: idx };
    images.splice(idx, 1);
    render();
    btnUndo.classList.remove("d-none");
    showToast("Image Removed", true);
  }

  function undoDelete() {
    if (lastDeleted) {
      images.splice(lastDeleted.index, 0, lastDeleted.item);
      lastDeleted = null;
      render();
      btnUndo.classList.add("d-none");
    }
  }

  function editCaption(idx, capEl) {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "form-control form-control-sm";
    input.value = images[idx].caption;
    capEl.replaceWith(input);
    input.focus();

    input.addEventListener("blur", () => {
      images[idx].caption = input.value;
      render();
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") input.blur();
    });
  }

  function autoFixSpacing(cols) {
    const items = grid.querySelectorAll(".cell");
    const total = items.length;
    items.forEach(i => i.style.gridColumn = "");

    if (total === 0) return;

    if (total < cols) {
      items[total - 1].style.gridColumn = "1 / -1";
      return;
    }

    const rem = total % cols;
    if (rem === 0) return;

    const span = cols - (rem - 1);
    if (span > 1) {
      items[total - 1].style.gridColumn = `span ${span}`;
    }
  }

  function addDragHandlers(el) {
    el.addEventListener("dragstart", (e) => {
      dragSrc = el;
      e.dataTransfer.effectAllowed = "move";
    });

    el.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      el.style.outline = "2px dashed #007bff";
    });

    el.addEventListener("dragleave", () => {
      el.style.outline = "";
    });

    el.addEventListener("drop", (e) => {
      e.preventDefault();
      el.style.outline = "";
      const from = parseInt(dragSrc.dataset.index);
      const to = parseInt(el.dataset.index);
      const moved = images.splice(from, 1)[0];
      images.splice(to, 0, moved);
      render();
    });
  }

  fileInput.addEventListener("change", (e) => {
    const files = [...e.target.files];
    let done = 0;

    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => {
        images.push({ id: uid(), src: ev.target.result, caption: "", name: f.name });
        done++;
        if (done === files.length) render();
      };
      reader.readAsDataURL(f);
    });

    fileInput.value = "";
  });

  document.getElementById("btnClear").onclick = () => {
    if (confirm("Clear all images?")) {
      images = [];
      render();
    }
  };

  document.getElementById("btnPrint").onclick = () => window.print();

  [titleInput, descInput, colsInput, gapInput, marginInput, fitMode]
    .forEach(el => el.addEventListener("input", render));

  render();
</script>

<script>
addQrBtn.addEventListener("click", () => {
  const url = urlInput.value.trim();
  if (!url) {
    alert("Please enter a URL");
    return;
  }

  images.push({
    id: uid(),
    type: "qr",
    url: url,
    caption: "For more Detail Scan Me "
  });

  urlInput.value = "";
  render();
});

</script>
