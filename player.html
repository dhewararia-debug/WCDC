<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Training Video Player – Subtitle Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
 --bg:#0e0e0e;
 --panel:#1a1a1a;
 --accent:#0d6efd;
 --text:#fff;
 --muted:#aaa;
}
body{background:var(--bg);color:var(--text)}
.panel{background:var(--panel);border-radius:12px;padding:12px}
video{background:#000;border-radius:12px}

 video {
  position: relative;
}

/* Add a pseudo overlay for custom positioning */
#video::after {
  content: attr(data-sub);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: var(--sub-bottom,20px);
  color: var(--cue-color,#fff);
  font-size: var(--cue-font-size,32px);
  background: rgba(0,0,0,0.75);
  padding:2px 6px;
  border-radius:8px;
  white-space: pre-line;
  pointer-events:none;
}


.playlist{max-height:380px;overflow:auto}
.playlist li{
 padding:8px;cursor:pointer;border-bottom:1px solid #333
}
.playlist li.active{background:var(--accent)}

#studioPanel{transition:all .3s ease}
#studioPanel.hide{display:none}

video::cue{
 font-size:32px;
 color:#fff;
 background:rgba(0,0,0,.75)
}
.sub-top::cue{vertical-align:top}
.sub-center::cue{vertical-align:middle}
.sub-bottom::cue{vertical-align:bottom}

.clip-item{
 border:1px solid #333;border-radius:6px;
 padding:6px;margin-bottom:6px
}
.clip-item small{color:var(--muted)}

 video::cue {
  font-size: var(--cue-font-size,32px);
  color: var(--cue-color,#fff);
  background: rgba(0,0,0,0.75);
}

 video::cue {
  font-size: var(--cue-font-size,32px);
  color: var(--cue-color,#fff);
  background: rgba(0,0,0,0.75);
  padding: 2px 6px;
  border-radius: 8px;      /* 🔹 Rounded corners */
  white-space: pre-line;   /* Preserve line breaks */
}

.sub-top::cue{vertical-align:top}
.sub-center::cue{vertical-align:middle}
.sub-bottom::cue{vertical-align:bottom}

</style>
</head>

<body>

<div class="container-fluid p-3">

<header class="text-center mb-3">
 <h3 contenteditable id="title">Department Training Program</h3>
 <p contenteditable id="desc" >
  Subtitle Authoring & Presentation
 </p>
</header>

<div class="row g-3">

<!-- MEDIA -->
<div class="col-md-3">
 <div class="panel">
  <h6 class="text-info">Media</h6>
  <input type="file" id="singleVideo" class="form-control mb-2" accept="video/*">
  <input type="file" id="folderPicker" class="form-control mb-2"
         webkitdirectory multiple accept="video/*">
  <ul id="playlist" class="playlist list-unstyled mb-0"></ul>
 </div>
</div>

<!-- VIDEO -->
<div class="col-md-5" id="videoCol">
 <div class="panel">
  <video id="video" class="w-100 h-100" height="420" controls></video>

  <!-- CONTROL BAR -->
  <div class="mt-3 d-flex flex-wrap gap-2 justify-content-center">
   <button id="play" class="btn btn-success">▶</button>
   <button id="prev" class="btn btn-secondary">⏮</button>
   <button id="next" class="btn btn-secondary">⏭</button>
   <button id="rewind" class="btn btn-warning">⏪10s</button>
   <button id="forward" class="btn btn-warning">10s⏩</button>

   <select id="speed" class="form-select w-auto">
    <option value="0.75">0.75x</option>
    <option value="1" selected>1x</option>
    <option value="1.25">1.25x</option>
    <option value="1.5">1.5x</option>
   </select>

   <button id="subToggle" class="btn btn-info">CC</button>
   <button id="toggleStudio" class="btn btn-outline-warning">
    📝 VTT</button>
   <button id="fullscreen" class="btn btn-primary">⛶</button>
  </div>
 </div>
</div>

<!-- SUBTITLE STUDIO -->
<div class="col-md-4" id="studioPanel">
 <div class="panel">
  <h6 class="text-warning">Subtitle Studio</h6>

  <label class="small">Font Size</label>
  <input type="range" id="subSize" min="20" max="48" value="32" class="form-range">

  <label class="small">Color</label>
  <input type="color" id="subColor" value="#ffffff" class="form-control mb-1">

  <label class="small">Position</label>
  <select id="subPosition" class="form-select mb-2">
   <option value="bottom">Bottom</option>
   <option value="center">Center</option>
   <option value="top">Top</option>
  </select>

  <hr>

  <input id="clipText" class="form-control mb-1"
         placeholder="Subtitle at current time">

  <div class="d-flex gap-2 mb-2">
   <input id="clipDuration" type="number" value="4" class="form-control">
   <button id="addClip" class="btn btn-success w-50">Add</button>
   <button id="exportVTT" class="btn btn-primary w-50">⬇ VTT</button>
  </div>

  <div id="clipList"></div>
 </div>
</div>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    function playVideo(index){
 if(!videoFiles[index]) return;
 state.index = index;
 video.src = URL.createObjectURL(videoFiles[index]);
 video.play();
 
 // Playlist active highlight
 $("#playlist li").removeClass("active").eq(index).addClass("active");
 
 renderSubtitle();
 renderClipList();
 save();
}

$("#singleVideo").change(e=>{
 videoFiles = [e.target.files[0]];
 $("#playlist").html(`<li class="active">${videoFiles[0].name}</li>`);
 playVideo(0);
});

$("#folderPicker").change(e=>{
 videoFiles = [...e.target.files].filter(f=>f.type.includes("video"));
 $("#playlist").empty();
 videoFiles.forEach((f,i)=>{
   $("#playlist").append(`<li data-i="${i}">${f.name}</li>`);
 });
 playVideo(0);
});

$("#playlist").on("click","li", function(){
 const i = $(this).data("i");
 playVideo(i);
});

 $("#next").click(()=>{
  const nextIndex = Math.min(state.index + 1, videoFiles.length - 1);
  playVideo(nextIndex);
});

 $("#prev").click(()=>{
  const prevIndex = Math.max(state.index - 1, 0);
  playVideo(prevIndex);
});

 $("#title, #desc").on("input", function(){
  state.title = $("#title").text();
  state.desc  = $("#desc").text();
  save();
});





const video=$("#video")[0];
let videoFiles=[];
const state = {index:0, subtitles:{}, hideStudio:false, title:"", desc:""};

function save(){localStorage.setItem("playerState",JSON.stringify(state))}
function load(){
 const d = localStorage.getItem("playerState");
 if(d) Object.assign(state, JSON.parse(d));

 // Restore Title & Description
 if(state.title) $("#title").text(state.title);
 if(state.desc)  $("#desc").text(state.desc);

 // Restore Subtitle Studio layout
 if(state.hideStudio){
   $("#studioPanel").addClass("hide");
   $("#videoCol").removeClass("col-md-5").addClass("col-md-9");
 }
}

load();

/* ------------------ UTIL ------------------ */
function formatTime(sec){
 const h=String(Math.floor(sec/3600)).padStart(2,'0');
 const m=String(Math.floor((sec%3600)/60)).padStart(2,'0');
 const s=String((sec%60).toFixed(3)).padStart(6,'0');
 return `${h}:${m}:${s}`;
}
function clearTracks(){
 video.querySelectorAll("track").forEach(t=>t.remove());
}

/* ------------------ SUBTITLES ------------------ */
function renderSubtitle(){
 const clips=state.subtitles[state.index]||[];
 if(!clips.length){clearTracks();return;}

 let vtt="WEBVTT\n\n";
 clips.forEach(c=>{
  vtt+=`${formatTime(c.start)} --> ${formatTime(c.end)}\n${c.text}\n\n`;
 });

 clearTracks();
 const t=document.createElement("track");
 t.kind="subtitles";t.default=true;
 t.src=URL.createObjectURL(new Blob([vtt],{type:"text/vtt"}));
 video.appendChild(t);
}

function renderClipList(){
 const clips=state.subtitles[state.index]||[];
 $("#clipList").empty();
 clips.forEach((c,i)=>{
  $("#clipList").append(`
   <div class="clip-item">
    <small>${formatTime(c.start)} → ${formatTime(c.end)}</small>
    <input class="form-control form-control-sm mt-1"
           value="${c.text}" data-i="${i}">
    <button class="btn btn-sm btn-danger mt-1 del" data-i="${i}">
     Delete
    </button>
   </div>
  `);
 });
}

/* ------------------ EVENTS ------------------ */
$("#addClip").click(()=>{
 const text=$("#clipText").val().trim();
 if(!text)return;

 state.subtitles[state.index]=state.subtitles[state.index]||[];
 state.subtitles[state.index].push({
  start:video.currentTime,
  end:video.currentTime+Number($("#clipDuration").val()),
  text
 });

 $("#clipText").val("");
 renderSubtitle();renderClipList();save();
});

$("#clipList").on("input","input",function(){
 state.subtitles[state.index][$(this).data("i")].text=this.value;
 renderSubtitle();save();
});

$("#clipList").on("click",".del",function(){
 state.subtitles[state.index].splice($(this).data("i"),1);
 renderSubtitle();renderClipList();save();
});

$("#exportVTT").click(()=>{
 const clips=state.subtitles[state.index];
 if(!clips||!clips.length)return;
 let vtt="WEBVTT\n\n";
 clips.forEach(c=>{
  vtt+=`${formatTime(c.start)} --> ${formatTime(c.end)}\n${c.text}\n\n`;
 });
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([vtt],{type:"text/vtt"}));
 a.download="subtitle.vtt";
 a.click();
});

/* TOGGLE STUDIO + RESIZE VIDEO */
$("#toggleStudio").click(()=>{
 const studio=$("#studioPanel");
 const videoCol=$("#videoCol");

 studio.toggleClass("hide");

 if(studio.hasClass("hide")){
  videoCol.removeClass("col-md-5").addClass("col-md-9");
  state.hideStudio=true;
 }else{
  videoCol.removeClass("col-md-9").addClass("col-md-5");
  state.hideStudio=false;
 }
 save();
});

 // Live subtitle style update
$("#subSize").on("input", function(){
  const size = $(this).val() + "px";
  video.querySelectorAll("track").forEach(track=>{
    track.mode="hidden"; // temporarily hide
    track.mode="showing"; // restore to apply style
  });
  document.querySelector("video").style.setProperty("--cue-font-size", size);
});

$("#subColor").on("input", function(){
  const color = $(this).val();
  document.querySelector("video").style.setProperty("--cue-color", color);
});

$("#subPosition").on("change", function(){
  const pos = $(this).val(); // bottom, center, top
  document.querySelector("video").classList.remove("sub-top","sub-center","sub-bottom");
  document.querySelector("video").classList.add("sub-"+pos);
});


/* VIDEO CONTROLS */
$("#play").click(()=>video.paused?video.play():video.pause());
$("#rewind").click(()=>video.currentTime-=10);
$("#forward").click(()=>video.currentTime+=10);
$("#fullscreen").click(()=>video.requestFullscreen());
$("#speed").change(()=>video.playbackRate=$("#speed").val());
$("#subToggle").click(()=>{
 const t=video.textTracks[0];
 if(t)t.mode=t.mode==="showing"?"hidden":"showing";
});
</script>

</body>
</html>
